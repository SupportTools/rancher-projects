name: vuln

# Re-enabled (was disabled_inactivity; cluster-services-1489). Not superseded by publish.yaml, which
# builds the image but does not scan the Go code.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
  - cron: '0 10 * * 1' # run "At 10:00 on Monday"
  workflow_call:

env:
  # govulncheck itself comes through Athens (a cache we run), pinned to a version.
  GOPROXY: https://goproxy.support.tools

jobs:
  run:
    name: Vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Latest stable Go: the findings that matter here are standard-library ones, fixed by the
      # toolchain the image is built with, not by go.mod.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -test ./...
