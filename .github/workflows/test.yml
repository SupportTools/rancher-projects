name: test

# Replaces the go checks of the deleted build.yaml (its Docker Hub push is superseded by publish.yaml;
# cluster-services-1489). Before this, test.yml was workflow_call only and no workflow ran the tests.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  # Go modules from Athens (a cache we run); the checksum DB stays on.
  GOPROXY: https://goproxy.support.tools

jobs:
  run:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Go Format
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }

      - name: Go Vet
        run: go vet ./...

      - name: Go Tidy
        run: go mod tidy && git diff --exit-code

      - name: Go Mod Verify
        run: go mod verify

      - name: Run tests
        run: go test -v -count=1 -race -shuffle=on ./...
