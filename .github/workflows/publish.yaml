name: publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # binfmt from the Harbor Docker Hub proxy-cache (anonymous pull), pinned by tag + index
          # digest instead of docker.io/tonistiigi/binfmt:latest (cluster-services-1470).
          image: harbor.support.tools/dockerhub/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # BuildKit from the Harbor Docker Hub proxy-cache instead of docker.io/moby/buildkit.
          driver-opts: image=harbor.support.tools/dockerhub/moby/buildkit:buildx-stable-1

      # Pull requests build only: no login, no push. The old run tagged the image with
      # github.ref_name, which is "20/merge" on a PR and is not a valid tag (cluster-services-1483).
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image (main)
        if: github.event_name == 'push'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t supporttools/rancher-projects:latest \
            -t supporttools/rancher-projects:${{ github.sha }} \
            -t supporttools/rancher-projects:${{ github.ref_name }} \
            --push .

      - name: Build Docker image (pull request, no push)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t rancher-projects:pr-${{ github.event.pull_request.number }} .
